<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 rounded-lg p-8 shadow-2xl max-w-sm w-full">
       <h2 class="text-center text-3xl text-white mb-7 font-bold">Login</h2>
       <form >
        <div class="mb-4">
            <label for="" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
            <input type="email" class="bg-gray-600 w-full px-3 py-2 border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500"  placeholder="Enter Email">
        </div>
         <div class="mb-6">
            <label for="" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
            <input type="password" class="bg-gray-600 w-full px-3 py-2 border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Password">
        </div>
        <button class="w-full bg-blue-500 py-2 text-white rounded-md hover:bg-blue-600 shadow-2xl" type="submit">Submit</button>
       </form>
    </div>
    
</body>
</html>
