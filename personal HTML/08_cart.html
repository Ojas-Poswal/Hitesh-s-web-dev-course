<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="08_cart.css">
</head>
<body>

<h1 class="title">My Cart</h1>

<table>
    <thead>
        <tr>
            <th>Book Name</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Amount (₹)</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Data Structures & Algorithms</td>
            <td class="price">650</td>
            <td>
                <input type="number" value="1" min="1" onchange="updateTotal()">
            </td>
            <td class="amount">650</td>
        </tr>

        <tr>
            <td>Operating System Concepts</td>
            <td class="price">720</td>
            <td>
                <input type="number" value="1" min="1" onchange="updateTotal()">
            </td>
            <td class="amount">720</td>
        </tr>
    </tbody>
</table>

<h2 class="total">Grand Total: ₹<span id="grandTotal">1370</span></h2>

<script>
function updateTotal() {
    let prices = document.getElementsByClassName("price");
    let amounts = document.getElementsByClassName("amount");
    let quantities = document.getElementsByTagName("input");

    let total = 0;

    for (let i = 0; i < prices.length; i++) {
        let price = parseInt(prices[i].innerText);
        let quantity = parseInt(quantities[i].value);
        let amount = price * quantity;

        amounts[i].innerText = amount;
        total += amount;
    }

    document.getElementById("grandTotal").innerText = total;
}
</script>

</body>
</html>
