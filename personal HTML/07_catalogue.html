<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">Library Book Catalogue</h1>

<div class="catalogue">

    <div class="book-card">
        <img src="https://covers.openlibrary.org/b/id/10521270-L.jpg" alt="Book Cover">
        <h3>Data Structures & Algorithms</h3>
        <p><b>Author:</b> Mark Allen Weiss</p>
        <p><b>Publisher:</b> Pearson</p>
        <p class="price">₹650</p>
        <button>Add to Cart</button>
    </div>

    <div class="book-card">
        <img src="https://covers.openlibrary.org/b/id/10416428-L.jpg" alt="Book Cover">
        <h3>Operating System Concepts</h3>
        <p><b>Author:</b> Silberschatz</p>
        <p><b>Publisher:</b> Wiley</p>
        <p class="price">₹720</p>
        <button>Add to Cart</button>
    </div>

    <div class="book-card">
        <img src="https://covers.openlibrary.org/b/id/10909258-L.jpg" alt="Book Cover">
        <h3>Computer Networks</h3>
        <p><b>Author:</b> Andrew S. Tanenbaum</p>
        <p><b>Publisher:</b> Pearson</p>
        <p class="price">₹680</p>
        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
