<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navugation bar variation</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
        }
        .nav-container{
            margin-bottom: 40px;
        }
        h2 {
            margin-bottom: 20px;
        }
        .nav1{
            background-color: #eaeaea;
            padding: 10px;
        }
        .nav1 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        .nav1 li{
            display: inline;
        }
        .nav1 a{
            text-decoration: none;
            color: #202020;
            
            padding: 5px 15px;
            position: relative;
        }
        .nav1 a::after{
            content: "";
            position: absolute;
            height: 2px;
            width: 100%;
            left: 0;
            bottom: 0;
            background-color: #0a65c7;
            transform: scaleX(0);
            transition: transform 0.3s
            ease-in-out;
        }
        .nav1 a:hover::after{
            transform: scaleX(1);
        }
        .nav1 .login-btn{
         background-color: #1c13c6;
         color: #fff;
         border: none;
         padding: 5px 15px;
         border-radius: 5px;
         cursor: pointer;
        }
        .nav2 {
            background-color: #19765a;
            width: 200px;
            padding: 20px;
        }
        .nav2 ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .nav2 li{
            margin-bottom: 12px;
        }
        .nav2 a{
            text-decoration: none;
            padding: 10px;
            color: #fff;
            display: block;
            width: 100%;
        }
        .nav2 a:hover{
            background-color: #1ad65c;
        }
        .nav2 .login-btn{
           background-color: #13d25c;
           width: 100%;
           padding: 10px;
           color: #eaeaea;
           border: none;
           border-radius: 5px;
           cursor: pointer;
        }
        .nav2 .login-btn:hover{
            background-color: #3fd715;
            border: 1px solid white;
        }
        .nav3{
            background-color: #13a8c9;
        }
        .nav3 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav3 a{
            text-decoration: none;
            color: #fff;
            padding: 20px;
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: #000000;
            min-width: 150px;
        }
        .nav3 .login-btn{
            background-color: #24c6f2;
            width: 90px;
            padding: 5px;
            border-radius: 6px;
            color: hsl(0, 0%, 100%);
            border: none;
            cursor: pointer;
        }
        .nav3 .login-btn:hover{
            background-color: #237dc2;
            border: 1px solid white;
        }
        
    </style>
</head>
<body>
    <div class="nav-container">
        <h2>Variation 1: Horizontal with underline effect</h2>
        <nav class="nav1">

            <ul>
               <li><a href="#">Home</a></li>
               <li><a href="#">About</a></li>
               <li><a href="#">Product</a></li>
               <li><button type="submit" class="login-btn">Login</button></li>
            </ul>
        </nav>
        
    </div>
    <div class="nav-container">
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class="nav2">

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Product</a></li>
                
            </ul>
            <button type="submit" class="login-btn">Login</button>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 3: Horizontal with drop down</h2>
        <nav class="nav3">

            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropdown">
                    <a href="#">About</a>
                    <div class="dropdown-content">
                        <a href="#">Our story</a>
                        <a href="#">Team</a>
                        <a href="#">Contact</a>
                    </div>
                 </li>
                <li><a href="#">Product</a></li>
                <li><button type="submit" class="login-btn">Login</button></li> 
            </ul>
        </nav>
    </div>
</body>
</html>
